packages:
  - .
# Allow immediate install of fresh Next.js releases (pnpm 11 enforces minimumReleaseAge by default).
minimumReleaseAgeExclude:
  - "@next/*"
  - next
  - react
  - react-dom
  - react-is
  - react-server-dom-*
  - nanoid
  - undici
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  esbuild: true
  lefthook: true
  msw: true
  sharp: true
ignoredBuiltDependencies:
  - sharp
  - unrs-resolver
