pre-commit:
  jobs:
    - name: oxfmt
      run: pnpm exec oxfmt {staged_files}
      glob:
        - "*.js"
        - "*.jsx"
        - "*.ts"
        - "*.tsx"
        - "*.json"
        - "*.jsonc"
        - "*.css"
        - "*.md"
        - "*.yml"
        - "*.yaml"
      exclude:
        - ".agents/**"
      stage_fixed: true

    - name: lint
      run: pnpm lint

    - name: fallow
      run: pnpm fallow:ci
