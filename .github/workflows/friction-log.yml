name: Friction Log

on:
  push:
  issues:
    types: [closed, reopened]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

concurrency:
  group: friction-log
  cancel-in-progress: false

permissions: {}

jobs:
  friction-log:
    name: Friction Log
    if: >-
      (github.event_name != 'push' || github.ref_name == github.event.repository.default_branch) && (github.event_name != 'issues' || github.event.issue.user.login == 'github-actions[bot]')
    # USE_SELF_HOSTED_RUNNERS repo variable (Settings → Actions → Variables)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-slim') }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          clean: ${{ vars.USE_SELF_HOSTED_RUNNERS != 'true' }}

      - name: Report and reconcile frictions
        uses: wevm/frog/action@a9f4314e3317975c5a8a6f0fc71332d7110f72b6
        with:
          token: ${{ github.token }}
          version: "1.0.15"
          issue-author: github-actions[bot]
