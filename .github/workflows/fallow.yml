# Fallow — independent zero-debt quality gate and native PR feedback.
#
# Runs the FULL repository gate (changed-code audit + project-wide dead-code,
# duplication, and health, every finding blocking) on pull requests during the
# staged required-check migration. There is no inherited debt and no new-only
# attribution anymore: exit code 1 means a real regression.
#
# The official Action is presentation-only for pull requests. Its audit uses
# the same gate-all policy, pinned CLI, and fresh coverage report as the
# authoritative standalone gate.
#
# This is intentionally a dedicated job, NOT folded into ci-reusable.yml,
# mirroring the React Doctor gate. The coverage coupling is preserved:
# `pnpm test:coverage` produces the fresh Istanbul report that fallow:full's
# audit and health probes consume for accurate CRAP scoring.
#
# The required "Fallow" status remains temporarily while the ruleset migration
# is staged. Remove this workflow only after the ruleset no longer requires it.

name: Fallow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: fallow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fallow:
    # Named so the check run is "Fallow", matching the required-status
    # instructions in the header comment above.
    name: Fallow
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain

      - name: Unit tests (with coverage)
        run: pnpm test:coverage

      - name: Fallow (native PR feedback)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: fallow-rs/fallow@85d490ce31ada36388dd59f7860716b261b48694 # v3.20.0
        with:
          command: audit
          gate: all
          type-aware: true
          type-aware-require: complete
          coverage: coverage/coverage-final.json
          coverage-root: ${{ github.workspace }}
          comment: true
          comment-layout: compact
          review-comments: true
          review-guidance: true
          branded-token: false
          sarif: false
          fail-on-issues: true

      - name: Fallow (full zero-debt scan)
        run: pnpm fallow:ci
