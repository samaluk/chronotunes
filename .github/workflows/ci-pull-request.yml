name: CI (pull request)

on:
  pull_request:

permissions:
  contents: read
  actions: read
  pull-requests: write
  checks: write

concurrency:
  group: ci-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
