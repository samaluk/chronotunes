name: CI (pull request)

on:
  pull_request:

concurrency:
  group: ci-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    secrets: inherit

  # The changed-code migration gate is separate from the full-repository CI
  # job: existing Fallow debt remains visible, but only newly introduced debt
  # blocks this adoption-phase PR.
  fallow-audit:
    name: Fallow PR review
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest') }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Unit tests (with coverage)
        run: pnpm test:coverage

      # Fallow analyzes once and renders all native PR feedback from the saved
      # JSON envelope. The full-repository CI job remains responsible for
      # project checks; this job only blocks newly introduced findings.
      - name: Fallow audit
        id: fallow
        uses: fallow-rs/fallow@ecf5a314fd3e10974acb4f5a7f867c433030522d # v3.17.0
        with:
          version: 3.17.0
          command: audit
          gate: new-only
          type-aware: true
          fail-on-issues: true
          format: json
          changed-since: origin/${{ github.base_ref }}
          coverage: coverage/coverage-final.json
          coverage-root: ${{ github.workspace }}
          dupes-mode: semantic
          args: --dupes-near --dupes-ignore-imports
          comment: true
          comment-layout: compact
          review-comments: true
          review-guidance: true
          branded-token: false
          sarif: false
