name: CI (pull request)

on:
  pull_request:

concurrency:
  group: ci-pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
    secrets: inherit

  # The changed-code migration gate is separate from the full-repository CI
  # job: existing Fallow debt remains visible, but only newly introduced debt
  # blocks this adoption-phase PR.
  fallow-audit:
    name: Fallow PR review
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest') }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Unit tests (with coverage)
        run: pnpm test:coverage

      # Fallow analyzes once and renders all native PR feedback from the saved
      # JSON envelope. The full-repository CI job remains responsible for
      # project checks; this job only blocks newly introduced findings.
      #
      # npm 11 redacts UUID-shaped segments in every command's stdout
      # (@npmcli/redact rewrites them to a literal '***'), and the Fallow
      # Action locates the installed CLI by parsing `npm root -g` output.
      # Homerun runner directories embed a UUID (.../runners/<uuid>/...), so
      # any prefix under RUNNER_TEMP makes the Action verify against a
      # mangled path and fail with platform-package-missing even though the
      # install succeeded. Keep the prefix free of UUID-shaped segments:
      # prefer the shared tool cache, falling back to mktemp when
      # RUNNER_TOOL_CACHE itself lives under a runner directory (older
      # Homerun runners ship an empty .env).
      - name: Provision isolated Fallow npm prefix
        run: |
          fallow_prefix="${RUNNER_TOOL_CACHE:-${RUNNER_TEMP}}/fallow-global-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          if printf '%s' "$fallow_prefix" | grep -qE '[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}'; then
            fallow_prefix="$(mktemp -d)/fallow-global-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
          fi
          mkdir -p "$fallow_prefix"
          echo "NPM_CONFIG_PREFIX=$fallow_prefix" >> "$GITHUB_ENV"
          echo "$fallow_prefix/bin" >> "$GITHUB_PATH"
          case "${RUNNER_OS}:${RUNNER_ARCH}" in
            macOS:ARM64) fallow_platform="@fallow-cli/darwin-arm64" ;;
            Linux:X64) fallow_platform="@fallow-cli/linux-x64-gnu" ;;
            *)
              echo "Unsupported Fallow runner: ${RUNNER_OS}:${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          NPM_CONFIG_PREFIX="$fallow_prefix" npm install --global --ignore-scripts \
            "fallow@3.17.0" "${fallow_platform}@3.17.0"

      - name: Fallow audit
        id: fallow
        uses: fallow-rs/fallow@ecf5a314fd3e10974acb4f5a7f867c433030522d # v3.17.0
        with:
          version: 3.17.0
          command: audit
          gate: new-only
          type-aware: true
          fail-on-issues: true
          format: json
          no-cache: true
          changed-since: origin/${{ github.base_ref }}
          coverage: coverage/coverage-final.json
          coverage-root: ${{ github.workspace }}
          dupes-mode: semantic
          args: --dupes-near --dupes-ignore-imports
          comment: true
          comment-layout: compact
          review-comments: true
          review-guidance: true
          branded-token: false
          sarif: false
