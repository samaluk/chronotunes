name: Reusable CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    # USE_SELF_HOSTED_RUNNERS repo variable (Settings → Actions → Variables)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","docker"]') || 'ubuntu-latest') }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Lint and format (Oxlint + Oxfmt)
        run: pnpm check

      - name: Typecheck
        run: pnpm next:typegen

      - name: Unit tests (with coverage)
        run: pnpm test:coverage

      - name: Fallow
        run: pnpm fallow:ci

      - name: Validate Frog friction log
        run: pnpx --yes frog@1.0.15 list

      - name: Cache Next.js
        if: runner.environment != 'self-hosted'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build
        run: pnpm build
