name: Reusable CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.0.8
        with:
          version: 11.5.1

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24.16.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format (Oxlint + Oxfmt)
        run: pnpm check

      - name: Typecheck
        run: pnpm next:typegen

      - name: Unit tests
        run: pnpm test:once

      - name: Cache Next.js
        uses: actions/cache@v5.0.5
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build
        run: pnpm build
