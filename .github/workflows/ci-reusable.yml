name: Reusable CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    # USE_SELF_HOSTED_RUNNERS repo variable (Settings → Actions → Variables)
    runs-on: ${{ vars.USE_SELF_HOSTED_RUNNERS == 'true' && (vars.SELF_HOSTED_RUNNER_LABELS != '' && fromJSON(vars.SELF_HOSTED_RUNNER_LABELS) || fromJSON('["self-hosted"]')) || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - uses: ./.github/actions/setup-toolchain

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format (Oxlint + Oxfmt)
        run: pnpm check

      - name: Typecheck
        run: pnpm next:typegen

      - name: Unit tests
        run: pnpm test:once

      - name: Cache Next.js
        if: runner.environment != 'self-hosted'
        uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build
        run: pnpm build
