name: Reusable CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-toolchain

      - name: Lint and format (Oxlint + Oxfmt)
        run: pnpm check

      - name: Typecheck
        run: pnpm next:typegen

      - name: Unit tests (with coverage)
        run: pnpm test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/coverage-final.json
          if-no-files-found: error

      - name: Validate Frog friction log
        run: pnpx --yes frog@1.0.15 list

      - name: Fallow (full zero-debt gate)
        run: pnpm fallow:ci

      - name: Cache Next.js
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build
        run: pnpm build

  fallow-feedback:
    name: Fallow feedback
    needs: ci
    if: ${{ always() && github.event_name == 'pull_request' && needs.ci.result != 'cancelled' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      actions: read
      pull-requests: write
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download coverage
        id: coverage-artifact
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      - name: Check coverage availability
        id: coverage
        shell: bash
        run: |
          if [[ -f coverage/coverage-final.json ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Coverage artifact is unavailable; skipping optional Fallow feedback."
          fi

      - name: Fallow (native PR feedback)
        if: steps.coverage.outputs.available == 'true'
        continue-on-error: true
        uses: fallow-rs/fallow@85d490ce31ada36388dd59f7860716b261b48694 # v3.20.0
        with:
          command: audit
          gate: all
          type-aware: true
          type-aware-require: complete
          coverage: coverage/coverage-final.json
          coverage-root: ${{ github.workspace }}
          comment: true
          comment-layout: compact
          review-comments: true
          review-guidance: true
          branded-token: false
          sarif: false
          fail-on-issues: true
