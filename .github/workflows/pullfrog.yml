# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    # Docker runner only. PULLFROG_RUNNER_LABELS is a JSON array, e.g.
    # ["self-hosted","Linux","X64","chronotunes-pullfrog"].
    runs-on: ${{ vars.PULLFROG_RUNNER_LABELS && fromJSON(vars.PULLFROG_RUNNER_LABELS) || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Run agent
        uses: pullfrog/pullfrog@v0
        with:
          prompt: ${{ inputs.prompt }}
