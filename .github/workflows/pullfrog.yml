# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    # PULLFROG_RUNNER_LABELS repo variable (Settings → Actions → Variables):
    # a JSON array of labels matching the homerun-managed Docker runner, e.g.
    # ["self-hosted","docker"]. Unset or empty falls back to GitHub-hosted
    # ubuntu-latest. Pullfrog needs a Linux runner: its shell tool requires
    # PID-namespace isolation and fails closed on macOS
    # (docs.pullfrog.com/security#self-hosted-runners).
    runs-on: ${{ vars.PULLFROG_RUNNER_LABELS && fromJSON(vars.PULLFROG_RUNNER_LABELS) || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Run agent
        uses: pullfrog/pullfrog@v0
        with:
          prompt: ${{ inputs.prompt }}
