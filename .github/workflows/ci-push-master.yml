name: CI (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  # The called workflow declares these permissions for its PR-only feedback job.
  # GitHub validates caller permissions before evaluating that job's condition.
  checks: write
  pull-requests: write

concurrency:
  group: ci-manual-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci-reusable.yml
