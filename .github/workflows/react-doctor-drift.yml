# React Doctor — drift scan.
#
# Full-repository scan that runs when the installed react-doctor VERSION
# changes, not on a cron: the workflow triggers on pushes to master that touch
# any package.json / pnpm-lock.yaml, resolves the exact installed react-doctor
# version, and uses it as the actions/cache key.
#
# Exactly-once semantics fall out of the version-keyed cache:
#   - a version never scanned before -> cache miss -> the full scan runs;
#   - dependency bumps that don't touch react-doctor keep the same key -> the
#     run is a cheap no-op;
#   - a failed scan is never cached (actions/cache only saves when the job
#     succeeds), so a broken version re-scans on the next trigger.
#
# The version probe greps pnpm-lock.yaml at the repo root for the exact
# resolved react-doctor version (survives Renovate manifest ranges; fails
# loudly if the dep leaves the lockfile). Like the PR gate, this workflow has
# no dependency-install step and no Node setup — the pinned action installs
# its own toolchain.
#
# Post-merge runs have no PR to annotate: comments and review comments are
# explicitly off, and the kept-on commit status is the trend marker on the
# default branch.

name: React Doctor (drift scan)

on:
  push:
    branches:
      - master
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-doctor-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-scan:
    # USE_SELF_HOSTED_RUNNERS repo variable — same fork/self-hosted policy as the
    # other workflow jobs; forks always fall back to GitHub-hosted runners.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest') }}
    # contents stays read-only; statuses: write lets the scan publish its
    # commit status (the trend marker on the default branch).
    permissions:
      contents: read
      statuses: write
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: ${{ vars.USE_SELF_HOSTED_RUNNERS != 'true' }}

      # The probe needs nothing but the lockfile — the pinned action installs
      # its own toolchain, so there is no dependency-install step here.
      - name: Resolve pinned react-doctor version
        id: rdver
        run: |
          v="$(sed -n 's/^ *react-doctor@\([0-9][0-9.]*\):.*/\1/p' pnpm-lock.yaml | head -1)"
          if [ -z "$v" ]; then echo "::error::react-doctor version not found in pnpm-lock.yaml"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already scanned
        id: seen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .rd-drift
          key: rd-drift-${{ steps.rdver.outputs.version }}

      - name: Mark this version as scanned
        if: steps.seen.outputs.cache-hit != 'true'
        run: mkdir -p .rd-drift && date > ".rd-drift/${{ steps.rdver.outputs.version }}"

      - name: React Doctor (full drift scan)
        if: steps.seen.outputs.cache-hit != 'true'
        uses: millionco/react-doctor@01820bb4fd4d0a4aebcd8df2b2a143a098649cb2 # v2.2.8
        with:
          # Scan with the exact CLI version the repo pins (same as the local
          # hooks and the PR gate), not the action's bundled latest.
          version: ${{ steps.rdver.outputs.version }}
          scope: full
          blocking: warning
          # The commit status is the trend marker on the default branch.
          commit-status: true
          # Post-merge runs have no PR to annotate — keep that explicit.
          comment: false
          review-comments: false
