# Fallow — drift scan.
#
# Full-repository zero-debt scan that runs when the installed fallow VERSION
# changes, not on a cron: the workflow triggers on pushes to master that touch
# any package.json / pnpm-lock.yaml, resolves the exact installed fallow
# version from pnpm-lock.yaml, and uses it as the actions/cache key.
#
# Exactly-once semantics fall out of the version-keyed cache:
#   - a version never scanned before -> cache miss -> the full scan runs;
#   - dependency bumps that don't touch fallow keep the same key -> the run is
#     a cheap no-op;
#   - a failed scan is never cached (actions/cache only saves when the job
#     succeeds), so a broken version re-scans on the next trigger.
#
# The version probe greps pnpm-lock.yaml at the repo root for the exact
# resolved fallow version (survives Renovate manifest ranges; fails loudly
# with ::error:: if the dep leaves the lockfile).
#
# Unlike the react-doctor drift scan, this workflow needs the repo toolchain:
# the health probe consumes a fresh Istanbul coverage report, so the scan step
# installs dependencies and runs the test suite before fallow:full.

name: Fallow (drift scan)

on:
  push:
    branches:
      - master
    paths:
      - "**/package.json"
      - "**/pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fallow-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift-scan:
    # USE_SELF_HOSTED_RUNNERS repo variable — same fork/self-hosted policy as the
    # other workflow jobs; forks always fall back to GitHub-hosted runners.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || (vars.USE_SELF_HOSTED_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest') }}
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: ${{ vars.USE_SELF_HOSTED_RUNNERS != 'true' }}

      # The probe needs nothing but the lockfile — resolve the pinned version
      # before paying for any toolchain setup.
      - name: Resolve pinned fallow version
        id: fver
        run: |
          v="$(sed -n 's/^ *fallow@\([0-9][0-9.]*\):.*/\1/p' pnpm-lock.yaml | head -1)"
          if [ -z "$v" ]; then echo "::error::fallow version not found in pnpm-lock.yaml"; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Check whether this version was already scanned
        id: seen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fallow-drift
          key: fallow-drift-${{ steps.fver.outputs.version }}

      - name: Mark this version as scanned
        if: steps.seen.outputs.cache-hit != 'true'
        run: mkdir -p .fallow-drift && date > ".fallow-drift/${{ steps.fver.outputs.version }}"

      - name: Set up toolchain
        if: steps.seen.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-toolchain

      - name: Unit tests (with coverage)
        if: steps.seen.outputs.cache-hit != 'true'
        run: pnpm test:coverage

      - name: Fallow (full zero-debt drift scan)
        if: steps.seen.outputs.cache-hit != 'true'
        run: pnpm fallow:full
