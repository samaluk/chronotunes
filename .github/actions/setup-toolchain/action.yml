name: Setup Node and pnpm
description: Install Node and pnpm versions from the root package.json

runs:
  using: composite
  steps:
    # Node must be installed before pnpm 11.x (requires Node >=22.13).
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: package.json

    # pnpm/setup downloads the exact self-contained version from packageManager,
    # avoiding action-setup's bootstrap and self-update path.
    - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
      with:
        dest: ~/setup-pnpm
        cache: true
